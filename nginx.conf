worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# Proxy L4 (TCP puro): o nginx NÃO faz parse HTTP, só repassa bytes entre o
# cliente e a API. Tira o overhead de parsing/reescrita de header HTTP do data
# path. A conexão cliente↔nginx é colada a uma conexão nginx↔API durante toda a
# vida da conexão TCP (keep-alive do k6 mantém isso eficiente).
stream {
    error_log /var/log/nginx/error.log warn;

    upstream fraud_api {
        least_conn;
        server unix:/sockets/api1.sock;
        server unix:/sockets/api2.sock;
    }

    server {
        listen 9999 backlog=1024 reuseport;
        tcp_nodelay on;
        proxy_pass fraud_api;
    }
}
