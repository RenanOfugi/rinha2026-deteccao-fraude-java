services:
  api1:
    image: renanofugi/rinha2026-deteccao-fraude:latest
    pull_policy: always
    environment:
      RINHA_FD_SOCKET: /sockets/api1-fd.sock
      RINHA_IVF_MAX_PROBES: "256"
      RINHA_IVF_PRUNE_MARGIN: "1.0"
      RINHA_HTTP_WORKERS: "1"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "165MB"

  api2:
    image: renanofugi/rinha2026-deteccao-fraude:latest
    pull_policy: always
    environment:
      RINHA_FD_SOCKET: /sockets/api2-fd.sock
      RINHA_IVF_MAX_PROBES: "256"
      RINHA_IVF_PRUNE_MARGIN: "1.0"
      RINHA_HTTP_WORKERS: "1"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "165MB"

  # Load balancer L4 com FD passing (SCM_RIGHTS) — substitui o nginx.
  # Aceita TCP em 9999 e passa o fd da conexão para uma das APIs via os
  # control sockets compartilhados no volume. Sai do data path após o handoff.
  lb:
    image: renanofugi/rinha2026-lb:latest
    pull_policy: always
    depends_on:
      - api1
      - api2
    environment:
      LISTEN_ADDR: 0.0.0.0:9999
      FD_UPSTREAMS: /sockets/api1-fd.sock,/sockets/api2-fd.sock
    ports:
      - "9999:9999"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "20MB"

volumes:
  api-sockets:
