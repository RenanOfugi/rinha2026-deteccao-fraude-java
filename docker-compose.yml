services:
  api1:
    image: renanofugi/rinha2026-deteccao-fraude:v14
    pull_policy: always
    environment:
      RINHA_FD_SOCKET: /sockets/api1-fd.sock
      RINHA_IVF_MAX_PROBES: "256"
      RINHA_IVF_PRUNE_MARGIN: "1.0"
      RINHA_HTTP_WORKERS: "1"
      # SO_BUSY_POLL (µs) no socket do cliente. 0/vazio = desligado. Ligar só
      # para medir: queima CPU em 1 vCPU e depende de NIC com NAPI busy poll.
      RINHA_BUSY_POLL_US: "0"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "165MB"

  api2:
    image: renanofugi/rinha2026-deteccao-fraude:v14
    pull_policy: always
    environment:
      RINHA_FD_SOCKET: /sockets/api2-fd.sock
      RINHA_IVF_MAX_PROBES: "256"
      RINHA_IVF_PRUNE_MARGIN: "1.0"
      RINHA_HTTP_WORKERS: "1"
      RINHA_BUSY_POLL_US: "0"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "165MB"

  # Load balancer L4 com FD passing (SCM_RIGHTS).
  # Aceita TCP em 9999 e passa o fd da conexão para uma das APIs via os
  # control sockets compartilhados no volume. Sai do data path após o handoff.
  lb:
    image: renanofugi/rinha2026-lb:v14
    pull_policy: always
    depends_on:
      - api1
      - api2
    environment:
      LISTEN_ADDR: 0.0.0.0:9999
      FD_UPSTREAMS: /sockets/api1-fd.sock,/sockets/api2-fd.sock
    ports:
      - "9999:9999"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "20MB"

volumes:
  # tmpfs (RAM): os control sockets do FD passing vivem em memória, não em
  # disco/overlayfs. Tira o filesystem do caminho de bind/connect/accept do
  # handoff de fd. Os bytes do request não passam por aqui (vão direto pelo fd),
  # mas o setup da conexão de controle fica mais rápido e previsível.
  api-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
