services:
  api1:
    image: renanofugi/rinha2026-deteccao-fraude:v1
    build:
      context: .
    environment:
      RINHA_UDS_PATH: /sockets/api1.sock
      RINHA_IVF_PROBES: "4"
      RINHA_IVF_REFINE_PROBES: "8"
      RINHA_HTTP_WORKERS: "1"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: renanofugi/rinha2026-deteccao-fraude:v1
    build:
      context: .
    environment:
      RINHA_UDS_PATH: /sockets/api2.sock
      RINHA_IVF_PROBES: "4"
      RINHA_IVF_REFINE_PROBES: "8"
      RINHA_HTTP_WORKERS: "1"
    volumes:
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - api-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  api-sockets:
