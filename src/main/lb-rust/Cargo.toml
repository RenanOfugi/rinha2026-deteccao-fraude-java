[package]
name = "rinha-lb"
version = "0.1.0"
edition = "2021"
publish = false
description = "L4 FD-passing load balancer para a Rinha 2026: TCP :9999 -> 2 APIs via SCM_RIGHTS."

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
